<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Security Command Dashboard</title>

  <!--
    HTMX DASHBOARD — no hand-written JavaScript.
    HTMX (loaded from the CDN at the bottom) drives every interaction:
      - gate filter change  -> re-fetches with ?gate=X
      - Refresh click       -> re-fetches with the current gate
      - page load           -> populates the table immediately
    The backend /api/entries/table endpoint returns HTML fragments that HTMX
    swaps into #entries-body, plus out-of-band updates for the status pill
    and entry counter.
  -->

  <style>
    :root {
      --bg:          #0f172a;
      --panel:       #1e293b;
      --border:      #334155;
      --text:        #e2e8f0;
      --muted:       #94a3b8;
      --green:       #34d399;
      --amber:       #fbbf24;
      --red:         #f87171;
      --blue:        #60a5fa;
      --accent:      #3b82f6;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      padding: 24px;
    }

    /* ── Header ── */
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 24px;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--border);
    }

    header h1 {
      font-size: 1rem;
      font-weight: 700;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: var(--muted);
    }

    /* Status badge — shows "Backend Connected" or "Waiting for backend..." */
    #status-badge {
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 1px;
      text-transform: uppercase;
      padding: 4px 12px;
      border-radius: 20px;
      border: 1px solid var(--border);
      color: var(--muted);
    }

    #status-badge.connected {
      color: var(--green);
      border-color: var(--green);
      background: rgba(52, 211, 153, 0.1);
    }

    /* ── Controls bar ── */
    .controls {
      display: flex;
      gap: 12px;
      align-items: center;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }

    .controls label {
      font-size: 0.78rem;
      color: var(--muted);
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    #gate-filter {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text);
      padding: 7px 12px;
      font-size: 0.85rem;
      cursor: pointer;
      outline: none;
    }

    #gate-filter:focus { border-color: var(--blue); }

    #refresh-btn {
      padding: 7px 16px;
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 6px;
      font-size: 0.82rem;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.2s;
    }

    #refresh-btn:hover { background: #2563eb; }

    /* ── Entry count ── */
    #entry-count {
      margin-left: auto;
      font-size: 0.78rem;
      color: var(--muted);
    }

    #entry-count span {
      font-weight: 700;
      color: var(--blue);
    }

    /* ── Table ── */
    .table-wrap {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.82rem;
    }

    thead th {
      padding: 10px 14px;
      text-align: left;
      font-size: 0.68rem;
      font-weight: 700;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: var(--muted);
      background: rgba(0,0,0,0.2);
      border-bottom: 1px solid var(--border);
    }

    tbody td {
      padding: 10px 14px;
      border-bottom: 1px solid rgba(51,65,85,0.5);
      color: var(--text);
    }

    tbody tr:last-child td { border-bottom: none; }

    tbody tr:hover td { background: rgba(255,255,255,0.03); }

    /* Gate colour badges */
    .gate-badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 4px;
      font-size: 0.7rem;
      font-weight: 700;
    }

    .gate-A { background: rgba(96,165,250,0.15);  color: #60a5fa; }
    .gate-B { background: rgba(167,139,250,0.15); color: #a78bfa; }
    .gate-C { background: rgba(52,211,153,0.15);  color: #34d399; }
    .gate-D { background: rgba(251,191,36,0.15);  color: #fbbf24; }

    /* ── Empty / loading state ── */
    .empty-cell {
      padding: 48px;
      text-align: center;
      color: var(--muted);
      font-size: 0.88rem;
    }
  </style>
</head>
<body>

  <!-- ── HEADER ── -->
  <header>
    <h1>🏟 Security Command Dashboard</h1>
    <!--
      Status badge — updated out-of-band by the /api/entries/table response
      via hx-swap-oob. Starts in a "waiting" state until the first fetch.
    -->
    <div id="status-badge">Waiting for backend…</div>
  </header>

  <!--
    ── CONTROLS ──
    This panel drives every fetch. HTMX attributes:
      hx-get       -> GET /api/entries/table
      hx-trigger   -> refire on gate-filter change, on Refresh click, and once
                      on page load
      hx-include   -> append the gate select so ?gate= reaches the backend
      hx-target    -> swap the returned rows into #entries-body
    The entry counter (below) is one of the out-of-band targets.
  -->
  <div
    class="controls"
    hx-get="/api/entries/table"
    hx-trigger="change from:#gate-filter, click from:#refresh-btn, load"
    hx-include="closest .controls #gate-filter"
    hx-target="#entries-body"
    hx-swap="innerHTML"
  >
    <label for="gate-filter">Filter by gate</label>

    <!--
      GATE FILTER DROPDOWN
      name="gate" lets HTMX send it as ?gate=A. Changing it triggers a fetch.
    -->
    <select id="gate-filter" name="gate">
      <option value="">All Gates</option>
      <option value="A">Gate A</option>
      <option value="B">Gate B</option>
      <option value="C">Gate C</option>
      <option value="D">Gate D</option>
    </select>

    <!--
      REFRESH BUTTON
      Clicking it triggers a fetch with the current gate selection.
    -->
    <button id="refresh-btn" type="button">↻ Refresh</button>

    <!-- Entry counter — value swapped out-of-band by the backend -->
    <div id="entry-count">Entries: <span id="count-value">—</span></div>
  </div>

  <!-- ── ENTRY TABLE ── -->
  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <!--
            Column headers match the stadium_entries table schema:
            id | person_id | gate | hour | bag
          -->
          <th>#</th>
          <th>Person ID</th>
          <th>Gate</th>
          <th>Hour</th>
          <th>Bag</th>
        </tr>
      </thead>

      <!--
        TBODY — HTMX swaps the <tr> rows returned by /api/entries/table into
        this element on every fetch (initial load, filter change, refresh).
      -->
      <tbody id="entries-body">
      </tbody>
    </table>
  </div>

  <!--
    HTMX is loaded from the CDN. It replaces app.js entirely — no hand-written
    fetch/render code is needed for this dashboard.
  -->
  <script src="https://unpkg.com/htmx.org@1.9.12"></script>

</body>
</html>
